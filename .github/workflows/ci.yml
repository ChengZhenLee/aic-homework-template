name: ci

# Runs the tests on every pull request and on every push to main,
# and can also be started by hand from the Actions tab ("Run workflow" button).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install boto3 pytest

      - name: Run the tests
        run: python -m pytest -q
